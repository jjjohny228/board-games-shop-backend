version: "3.8"

services:
  web:
    build: .
    expose:
      - 8000
    volumes:
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  media_volume:
